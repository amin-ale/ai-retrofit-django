[project]
name = "ai-retrofit-django"
version = "0.1.0"
description = "AI copilot retrofitted into an existing Django SaaS: semantic search, guarded ask-your-data, summarization, feature flags, per-tenant cost caps, eval-gated CI, zero schema breakage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amin Ale", email = "amin.ale.business@gmail.com" }]
keywords = ["django", "llm", "ai-retrofit", "sql-guardrail", "semantic-search", "multi-tenant", "anthropic", "pii-redaction"]
dependencies = [
    "django==5.2.4",
    "httpx==0.28.1",
    "sqlparse==0.5.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-django==4.9.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "helpdesk_project.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helpdesk_project", "helpdesk", "copilot"]
